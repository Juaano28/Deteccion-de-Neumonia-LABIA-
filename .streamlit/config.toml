[global]
developmentMode = false

[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#128375"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#13283D"
font = "sans serif"
